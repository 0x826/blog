  const openBtn = document.querySelector("[data-search-open]");
  const dialog = document.querySelector("[data-search-dialog]");
  const input = document.querySelector("[data-search-input]");
  const results = document.querySelector("[data-search-results]");

  if (
    openBtn &&
    dialog instanceof HTMLDialogElement &&
    input instanceof HTMLInputElement &&
    results
  ) {
    let index = [];
    let loaded = false;

    async function ensureIndex() {
      if (loaded) return;
      const res = await fetch(searchIndexUrl);
      index = await res.json();
      loaded = true;
    }

    function render(q) {
      const query = q.trim().toLowerCase();
      if (!query) {
        results.innerHTML = "";
        return;
      }
      const hits = index
        .filter((item) =>
          `${item.title} ${item.description} ${item.topic}`
            .toLowerCase()
            .includes(query),
        )
        .slice(0, 8);
      results.innerHTML = hits.length
        ? hits
            .map(
              (item) =>
                `<li><a href="${item.href}"><strong>${item.title}</strong><span>${item.description}</span></a></li>`,
            )
            .join("")
        : `<li class="empty">没有匹配结果</li>`;
    }

    openBtn.addEventListener("click", async () => {
      await ensureIndex();
      dialog.showModal();
      input.value = "";
      results.innerHTML = "";
      input.focus();
    });

    input.addEventListener("input", () => render(input.value));

    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
  }
})();</script><main class="wrap page-main" data-astro-cid-xa52sxzc><header class="topic-header" data-astro-cid-aezt6mnq><h1 data-astro-cid-aezt6mnq>html</h1><p data-astro-cid-aezt6mnq>1 篇文章 · <a href="/tags/" data-astro-cid-aezt6mnq>全部标签</a></p></header><ol class="post-feed" data-astro-cid-2dmf2pwf><li class="post-card" data-astro-cid-2dmf2pwf><a class="post-card-image-link" href="/web/html/" tabindex="-1" aria-hidden="true" data-astro-cid-2dmf2pwf><img class="post-card-image" src="/images/covers/code-monitor.jpg" alt="" loading="lazy" width="640" height="360" data-astro-cid-2dmf2pwf></a><h2 class="post-card-title" data-astro-cid-2dmf2pwf><a href="/web/html/" data-astro-cid-2dmf2pwf>HTML</a></h2><p class="post-card-excerpt" data-astro-cid-2dmf2pwf>HTML</p></li></ol></main><footer class="site-footer" data-astro-cid-jo6i4kqk><div class="wrap bar" data-astro-cid-jo6i4kqk><a class="brand" href="/" data-astro-cid-jo6i4kqk>rty</a><div class="social" aria-label="社交链接" data-astro-cid-jo6i4kqk><a href="mailto:peonyfoals@gmail.com" aria-label="Email" data-astro-cid-jo6i4kqk><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" data-astro-cid-jo6i4kqk><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z" data-astro-cid-jo6i4kqk></path></svg></a><a href="/rss.xml" aria-label="RSS" data-astro-cid-jo6i4kqk><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" data-astro-cid-jo6i4kqk><path fill="currentColor" d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20 5 20 4 19 4 17.82c0-1.2.98-2.18 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27zm0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93z" data-astro-cid-jo6i4kqk></path></svg></a><a href="/archive/" aria-label="归档" data-astro-cid-jo6i4kqk><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" data-astro-cid-jo6i4kqk><path fill="currentColor" d="M4 6h16v2H4zm0 5h16v2H4
